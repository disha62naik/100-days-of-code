<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Guess Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div id="gameCard" class="bg-white p-8 rounded-xl shadow-lg w-96 text-center">

        <h1 class="text-2xl font-bold mb-4">Number Guess Game</h1>

        <p class="mb-4 text-gray-600">
            Guess a number between 1 and 100
        </p>

        <input 
            id="guessInput" 
            type="number" 
            placeholder="Enter number"
            class="w-full p-2 border rounded mb-4"
        />

        <button 
            id="guessBtn"
            class="bg-blue-500 text-white px-4 py-2 rounded w-full mb-3 hover:bg-blue-600"
        >
            Guess
        </button>

        <button 
            id="resetBtn"
            class="bg-gray-500 text-white px-4 py-2 rounded w-full hover:bg-gray-600"
        >
            New Game
        </button>

        <p id="feedback" class="mt-4 font-semibold"></p>

        <p class="mt-2 text-sm text-gray-500">
            Attempts left: <span id="attempts"></span>
        </p>

    </div>

    <script src="script.js"></script>
</body>
</html>
