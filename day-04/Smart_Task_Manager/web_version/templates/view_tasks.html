{% extends "base.html" %}
{% block content %}
<h2>All Tasks</h2>

{% if tasks %}
    {% for task in tasks %}
        <div class="task-item">
            <span class="{% if task.completed %}completed{% endif %}">
                {{ task.title }} ({{ task.priority }})
            </span>

            {% if not task.completed %}
                <a href="/complete/{{ task.id }}">Complete</a>
            {% endif %}

            <a href="/delete/{{ task.id }}">Delete</a>
        </div>
    {% endfor %}
{% else %}
    <p>No tasks found.</p>
{% endif %}

{% endblock %}
